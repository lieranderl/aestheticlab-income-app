root = "."
tmp_dir = "tmp"

[build]
  cmd = "bun run assets && go tool templ generate && go build -o ./tmp/web ./cmd/web"
  entrypoint = ["./tmp/web"]
  delay = 500
  include_dir = ["cmd", "internal", "frontend", "static"]
  include_ext = ["go", "templ", "css", "js"]
  exclude_dir = ["tmp", "bin", "node_modules", ".git", "docs"]
  exclude_file = ["static/app.css", "internal/views/icons_gen.go"]
  exclude_regex = ["_test.go", ".*_templ.go"]
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
